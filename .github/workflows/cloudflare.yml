name: Cloudflare

# Pull requests: build and test only, no secrets, nothing deployed.
# Push to the `uat` branch, or run manually: deploy to UAT.
# Production: manual only, from `main`, behind the `production` environment's required
# reviewers (Settings > Environments). It uploads a new version without moving traffic;
# promote it with `wrangler versions deploy` after checking it (docs/CLOUDFLARE_DEPLOYMENT.md).
on:
  pull_request:
  push:
    branches: [uat]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [uat, production]
        default: uat

concurrency:
  group: cloudflare-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:unit
      - name: Build the Worker (production settings, no tags)
        run: node scripts/cf.mjs build local
      - name: Check the bundle with Wrangler
        run: npx wrangler deploy --dry-run --outdir dist-dry-run

  deploy-uat:
    name: Deploy UAT
    needs: check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'uat')
    runs-on: ubuntu-latest
    environment: uat
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:deploy:uat

  upload-production:
    name: Upload production version (no traffic)
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Build-time tag IDs. Leave unset until the privacy wording is approved.
      NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
      NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
      NEXT_PUBLIC_GOOGLE_ADS_LEAD_LABEL: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_LEAD_LABEL }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:upload:production
